name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm install`, not `npm ci`: the lockfile is generated on Windows and
      # cannot materialize @trezor/connect's platform-specific subtree for
      # Linux, which makes `npm ci` fail the sync check.
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          # Pages serves from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}
      # Jekyll would drop the _next/ directory otherwise.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
